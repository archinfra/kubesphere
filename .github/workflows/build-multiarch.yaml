name: Build Backend Container Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag. Defaults to the current ref name plus short SHA for branch builds.
        required: false
        default: ""
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64,linux/arm64
  push:
    branches:
      - master
      - release-*
      - ai-native/*
    paths:
      - ".github/workflows/build-multiarch.yaml"
      - "api/**"
      - "build/ks-apiserver/**"
      - "build/ks-controller-manager/**"
      - "cmd/**"
      - "config/ks-core/**"
      - "hack/**"
      - "pkg/**"
      - "staging/**"
      - "vendor/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.BACKEND_IMAGE_NAMESPACE || vars.IMAGE_NAMESPACE || github.repository }}
  APISERVER_IMAGE_NAME: ${{ vars.APISERVER_IMAGE_NAME || 'ks-apiserver' }}
  CONTROLLER_IMAGE_NAME: ${{ vars.CONTROLLER_IMAGE_NAME || 'ks-controller-manager' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          input_version="${{ inputs.version || '' }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${input_version}" ]]; then
            version="${input_version}"
          else
            safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '/_' '--' | tr -cd 'A-Za-z0-9._-')"
            version="${safe_ref}-${GITHUB_SHA::7}"
          fi

          apiserver_image="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${APISERVER_IMAGE_NAME}"
          controller_image="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${CONTROLLER_IMAGE_NAME}"
          apiserver_tags="${apiserver_image}:${version}"
          controller_tags="${controller_image}:${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            apiserver_tags="${apiserver_tags}"$'\n'"${apiserver_image}:latest"
            controller_tags="${controller_tags}"$'\n'"${controller_image}:latest"
          fi

          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "apiserver_ref=${apiserver_image}:${version}" >>"${GITHUB_OUTPUT}"
          echo "controller_ref=${controller_image}:${version}" >>"${GITHUB_OUTPUT}"
          {
            echo "apiserver_tags<<EOF"
            echo "${apiserver_tags}"
            echo "EOF"
            echo "controller_tags<<EOF"
            echo "${controller_tags}"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      - name: Build and push ks-apiserver
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: build/ks-apiserver/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.vars.outputs.apiserver_tags }}
          labels: |
            org.opencontainers.image.title=ks-apiserver
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push ks-controller-manager
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: build/ks-controller-manager/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.vars.outputs.controller_tags }}
          labels: |
            org.opencontainers.image.title=ks-controller-manager
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Validate backend binaries in published images
        shell: bash
        env:
          APISERVER_IMAGE: ${{ steps.vars.outputs.apiserver_ref }}
          CONTROLLER_IMAGE: ${{ steps.vars.outputs.controller_ref }}
          TARGET_PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y file

          validate_binary() {
            local image="$1"
            local platform="$2"
            local binary_path="$3"
            local expected_arch="${platform##*/}"
            local tmp_dir
            local cid
            local host_binary
            local info

            tmp_dir="$(mktemp -d)"
            cid="$(docker create --platform "${platform}" "${image}")"
            host_binary="${tmp_dir}/$(basename "${binary_path}")"

            docker cp "${cid}:${binary_path}" "${host_binary}"
            docker rm -f "${cid}" >/dev/null

            info="$(file "${host_binary}")"
            echo "${image} ${platform}: ${info}"

            case "${expected_arch}" in
              amd64)
                grep -Eq 'x86-64|x86_64' <<<"${info}"
                ;;
              arm64)
                grep -Eq 'aarch64|ARM aarch64' <<<"${info}"
                ;;
              *)
                echo "Unsupported platform arch: ${expected_arch}" >&2
                exit 1
                ;;
            esac

            rm -rf "${tmp_dir}"
          }

          IFS=',' read -ra platforms <<<"${TARGET_PLATFORMS}"
          for platform in "${platforms[@]}"; do
            validate_binary "${APISERVER_IMAGE}" "${platform}" "/usr/local/bin/ks-apiserver"
            validate_binary "${CONTROLLER_IMAGE}" "${platform}" "/usr/local/bin/ks-controller-manager"
          done

      - name: Summary
        run: |
          echo "Published backend images for ${{ steps.vars.outputs.version }}"
          echo "${{ steps.vars.outputs.apiserver_tags }}"
          echo "${{ steps.vars.outputs.controller_tags }}"
