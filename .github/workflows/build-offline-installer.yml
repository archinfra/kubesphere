name: Build Offline Run Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer and image tag
        required: true
        default: v0.1.0
      arch:
        description: Target architecture
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
          - all
      image_registry:
        description: Source image registry. Empty means vars.IMAGE_REGISTRY or ghcr.io.
        required: false
        default: ""
      image_namespace:
        description: Source image namespace/org. Empty means vars.IMAGE_NAMESPACE or the GitHub org.
        required: false
        default: ""
      apiserver_image:
        description: Optional full ks-apiserver image override.
        required: false
        default: ""
      controller_image:
        description: Optional full ks-controller-manager image override.
        required: false
        default: ""
      console_image:
        description: Optional full ks-console image override.
        required: false
        default: ""
      kubectl_image:
        description: Source kubectl image.
        required: true
        default: bitnami/kubectl:1.33.1
      redis_image:
        description: Source redis image.
        required: true
        default: redis:7.2.7-alpine
  push:
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-offline-installer.yml"
      - "config/ks-core/**"
      - "hack/release/**"

permissions:
  contents: write
  packages: read

env:
  DEFAULT_IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  DEFAULT_IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}

jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Resolve package metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            arch="${{ matrix.arch }}"
            image_registry="${DEFAULT_IMAGE_REGISTRY}"
            image_namespace="${DEFAULT_IMAGE_NAMESPACE}"
            apiserver_image=""
            controller_image=""
            console_image=""
            kubectl_image="bitnami/kubectl:1.33.1"
            redis_image="redis:7.2.7-alpine"
          else
            version="${{ inputs.version }}"
            arch="${{ inputs.arch }}"
            image_registry="${{ inputs.image_registry }}"
            image_namespace="${{ inputs.image_namespace }}"
            apiserver_image="${{ inputs.apiserver_image }}"
            controller_image="${{ inputs.controller_image }}"
            console_image="${{ inputs.console_image }}"
            kubectl_image="${{ inputs.kubectl_image }}"
            redis_image="${{ inputs.redis_image }}"
          fi

          image_registry="${image_registry:-${DEFAULT_IMAGE_REGISTRY}}"
          image_namespace="${image_namespace:-${DEFAULT_IMAGE_NAMESPACE}}"

          if [[ "${arch}" != "all" && "${arch}" != "${{ matrix.arch }}" ]]; then
            echo "skip=true" >>"${GITHUB_OUTPUT}"
          else
            echo "skip=false" >>"${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "image_registry=${image_registry}" >>"${GITHUB_OUTPUT}"
          echo "image_namespace=${image_namespace}" >>"${GITHUB_OUTPUT}"
          echo "apiserver_image=${apiserver_image}" >>"${GITHUB_OUTPUT}"
          echo "controller_image=${controller_image}" >>"${GITHUB_OUTPUT}"
          echo "console_image=${console_image}" >>"${GITHUB_OUTPUT}"
          echo "kubectl_image=${kubectl_image}" >>"${GITHUB_OUTPUT}"
          echo "redis_image=${redis_image}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.vars.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to image registry
        if: steps.vars.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.image_registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      - name: Install packaging tools
        if: steps.vars.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          chmod +x hack/release/install-offline.sh hack/release/package-offline-run-from-images.sh

      - name: Build offline run installer from images
        if: steps.vars.outputs.skip != 'true'
        env:
          APISERVER_IMAGE: ${{ steps.vars.outputs.apiserver_image }}
          CONTROLLER_IMAGE: ${{ steps.vars.outputs.controller_image }}
          CONSOLE_IMAGE: ${{ steps.vars.outputs.console_image }}
        run: |
          args=(
            --version "${{ steps.vars.outputs.version }}"
            --arch "${{ matrix.arch }}"
            --image-registry "${{ steps.vars.outputs.image_registry }}"
            --image-namespace "${{ steps.vars.outputs.image_namespace }}"
            --kubectl-image "${{ steps.vars.outputs.kubectl_image }}"
            --redis-image "${{ steps.vars.outputs.redis_image }}"
          )
          if [[ -n "${APISERVER_IMAGE}" ]]; then
            args+=(--apiserver-image "${APISERVER_IMAGE}")
          fi
          if [[ -n "${CONTROLLER_IMAGE}" ]]; then
            args+=(--controller-image "${CONTROLLER_IMAGE}")
          fi
          if [[ -n "${CONSOLE_IMAGE}" ]]; then
            args+=(--console-image "${CONSOLE_IMAGE}")
          fi
          hack/release/package-offline-run-from-images.sh "${args[@]}"

      - name: Upload artifacts
        if: steps.vars.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-k8s-platform-${{ steps.vars.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/ai-k8s-platform-${{ steps.vars.outputs.version }}-${{ matrix.arch }}.run
            dist/ai-k8s-platform-${{ steps.vars.outputs.version }}-${{ matrix.arch }}.run.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
